name: Budowanie aplikacji

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK)
    needs: test
    # Na razie skupiamy się na iPhonie - Android wróci, gdy aplikacja będzie gotowa.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Stały klucz podpisu z ukrytych „Secrets” repozytorium (jeśli ustawione) - dzięki niemu
      # nowa wersja instaluje się na starej. Bez nich APK jest podpisany kluczem testowym.
      - name: Klucz podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=kamery"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --build-number ${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk AriView.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: AriView.apk

  ios:
    name: iPhone (IPA)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Bez podpisu Apple - podpisuje go Sideloadly przy instalacji (darmowe Apple ID).
      - run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - name: Pakowanie IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/AriView.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: AriView.ipa

  release:
    name: Publikacja do pobrania
    needs: [ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ios
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AriView 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **iPhone:** pobierz `AriView.ipa` na komputer i zainstaluj programem Sideloadly (instrukcja w README).
          files: |
            AriView.ipa
